# =============================================================================
# Water Bearer Coffee — CMS config (Sveltia CMS, Decap-compatible)
# -----------------------------------------------------------------------------
# Azure can edit ONLY: Menu, Summer Specials, Hours, the About page, and the
# homepage hero photo. Layout, colors, fonts, navigation, page structure, SEO,
# the Shop/Square buy-buttons, and every other page are locked in code and are
# NOT editable here. (Square embed snippets never go through the CMS.)
# =============================================================================

backend:
  name: git-gateway
  branch: main

# Uploaded photos are committed to the repo and served from /images/uploads/.
media_folder: "public/images/uploads"
public_folder: "/images/uploads"

# A friendlier default; keeps edits on a branch + PR is possible later.
publish_mode: simple

# --- Image optimization on upload -------------------------------------------
# Resize large photos and convert to WebP right in the browser, so a 5 MB phone
# photo can't tank page performance. A build-time pass (scripts/optimize-images.mjs)
# is the backstop that runs on every deploy regardless.
media_libraries:
  default:
    config:
      transformations:
        raster_image:
          format: webp
          quality: 82
          width: 1600
          height: 1600

collections:
  # --- Menu (one file per item) ----------------------------------------------
  - name: "menu"
    label: "Menu"
    label_singular: "Menu item"
    description: "Your café menu. Add, edit, remove, hide, or reorder items. Each item shows under a section (Coffee, Teas, Smoothies, Food)."
    folder: "src/content/menu"
    create: true
    slug: "{{fields.name}}"
    identifier_field: "name"
    format: "frontmatter"
    summary: "{{name}}  ·  {{category}}"
    sortable_fields: ["order", "name", "category"]
    fields:
      - { label: "Item name", name: "name", widget: "string" }
      - { label: "Section", name: "category", widget: "select", options: ["Coffee", "Teas", "Smoothies", "Food"], default: "Coffee", hint: "Which part of the menu this item shows under." }
      - { label: "Description", name: "description", widget: "text", required: false }
      - { label: "Price", name: "price", widget: "string", required: false, hint: "Optional, for your own records. Prices are not shown on the website right now." }
      - { label: "Photo", name: "image", widget: "image", required: false, hint: "Optional. A blue placeholder shows if you leave it empty." }
      - { label: "Photo description (for accessibility)", name: "imageAlt", widget: "string", required: false }
      - { label: "Made in house", name: "madeInHouse", widget: "boolean", default: false, hint: "For your records. (No badge is shown on the site right now.)" }
      - { label: "Hide this item (seasonal)", name: "hidden", widget: "boolean", default: false, hint: "Turn ON to pull this item off the menu without deleting it. Turn OFF to bring it back." }
      - { label: "Order (lower shows first)", name: "order", widget: "number", default: 100, value_type: "int", hint: "Sets the order within its section. Lower numbers appear first." }

  # --- Summer Specials --------------------------------------------------------
  - name: "specials"
    label: "Summer Specials"
    label_singular: "Special"
    description: "The specials shown on the homepage. A special disappears from the site automatically after its end date."
    folder: "src/content/specials"
    create: true
    slug: "{{slug}}"
    format: "frontmatter"
    summary: "{{title}}"
    fields:
      - { label: "Name", name: "title", widget: "string" }
      - { label: "Description", name: "description", widget: "text" }
      - { label: "Photo", name: "image", widget: "image", required: false, hint: "Optional. A blue placeholder shows if left empty." }
      - { label: "Photo description (for accessibility)", name: "imageAlt", widget: "string", required: false }
      - { label: "Start date", name: "start", widget: "datetime", required: false, format: "YYYY-MM-DD", date_format: "YYYY-MM-DD", time_format: false, hint: "Optional." }
      - { label: "End date (disappears after this day)", name: "end", widget: "datetime", format: "YYYY-MM-DD", date_format: "YYYY-MM-DD", time_format: false }

  # --- Hours (single file) ----------------------------------------------------
  - name: "hours"
    label: "Hours"
    files:
      - name: "hours"
        label: "Opening Hours"
        file: "src/content/settings/hours.json"
        description: "Set open and close times for each day, or mark a day closed."
        fields:
          - label: "Week"
            name: "week"
            widget: "list"
            allow_add: false
            collapsed: false
            fields:
              - { label: "Day", name: "day", widget: "string", readonly: true }
              - { label: "Closed?", name: "closed", widget: "boolean", default: false }
              - { label: "Opens", name: "open", widget: "string", hint: "24-hour, e.g. 08:00" }
              - { label: "Closes", name: "close", widget: "string", hint: "24-hour, e.g. 15:00" }
          - { label: "Kitchen note", name: "kitchenNote", widget: "string", required: false, hint: "Shown under the hours, e.g. 'Kitchen closes daily at 2 PM.' Leave empty to hide." }

  # --- About page (single file) ----------------------------------------------
  - name: "about"
    label: "About Page"
    files:
      - name: "about"
        label: "About Page Content"
        file: "src/content/settings/about.json"
        fields:
          - label: "Owner"
            name: "owner"
            widget: "object"
            fields:
              - { label: "Name", name: "name", widget: "string" }
              - { label: "Role", name: "role", widget: "string" }
              - { label: "Photo", name: "image", widget: "image", required: false }
              - { label: "Photo description", name: "imageAlt", widget: "string", required: false }
              - { label: "Bio", name: "bio", widget: "text" }
          - label: "Roaster"
            name: "roaster"
            widget: "object"
            fields:
              - { label: "Name", name: "name", widget: "string" }
              - { label: "Role", name: "role", widget: "string" }
              - { label: "Photo", name: "image", widget: "image", required: false }
              - { label: "Photo description", name: "imageAlt", widget: "string", required: false }
              - { label: "Bio", name: "bio", widget: "text" }
          - label: "Community"
            name: "community"
            widget: "object"
            fields:
              - { label: "Heading", name: "heading", widget: "string" }
              - { label: "Intro", name: "intro", widget: "text" }
              - label: "Local businesses"
                name: "businesses"
                widget: "list"
                fields:
                  - { label: "Name", name: "name", widget: "string" }
                  - { label: "What they do", name: "detail", widget: "string" }
              - { label: "Artists heading", name: "artistsHeading", widget: "string", required: false }
              - { label: "Artists intro", name: "artistsIntro", widget: "text", required: false }
              - label: "Local artists"
                name: "artists"
                widget: "list"
                required: false
                fields:
                  - { label: "Name", name: "name", widget: "string" }
                  - { label: "What they made", name: "detail", widget: "string" }

  # --- Homepage hero photo (single file) -------------------------------------
  - name: "homepage"
    label: "Homepage"
    files:
      - name: "home"
        label: "Homepage Hero"
        file: "src/content/settings/home.json"
        description: "The big photo at the top of the home page."
        fields:
          - { label: "Hero photo", name: "heroImage", widget: "image", required: false, hint: "Leave empty to show the blue placeholder." }
          - { label: "Photo description (for accessibility)", name: "heroImageAlt", widget: "string" }