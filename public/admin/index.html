<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="robots" content="noindex" />
    <link rel="icon" href="/favicon.svg" />
    <title>Water Bearer Coffee — Content Editor</title>
    <style>
      /* Subtle brand tint on the login screen. Decap's editor covers this fully
         once you're logged in, so it only shows on the sign-in page. */
      body { background: #eef5fd; }
    </style>
  </head>
  <body>
    <!-- Netlify Identity handles Azure's email/password login; Decap CMS is the
         editor UI. Decap supports the Git Gateway backend (Sveltia dropped it),
         which is what lets Azure log in without a GitHub account.
         Both load only on this admin page, so they never slow the public site. -->
    <script src="https://identity.netlify.com/v1/netlify-identity-widget.js"></script>
    <script src="https://unpkg.com/decap-cms@^3.0.0/dist/decap-cms.js"></script>
  </body>
</html>
